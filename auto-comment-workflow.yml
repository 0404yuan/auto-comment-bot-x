# This GitHub Actions workflow adds a comment to every newly opened issue.
# NOTE: It could not be committed directly to .github/workflows/ because the
# automation token lacks the required "workflow" scope.
# To enable it: move this file to .github/workflows/auto-comment.yml
name: Auto Comment on New Issues

on:
  issues:
    types: [opened]

permissions:
  issues: write

jobs:
  add-comment:
    runs-on: ubuntu-latest
    steps:
      - name: Add comment to new issue
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: 'Thank you for your contribution!'
            })
